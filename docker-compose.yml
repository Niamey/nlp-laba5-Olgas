version: "3.9"

services:

  # ── Агент (основний процес) ────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # MCP сервер запускається як subprocess всередині агента
      # тому окремий service для нього не потрібен при stdio transport
      CACHE_DIR: /data/cache
    volumes:
      - triage_cache:/data/cache
      - ./trajectories:/app/trajectories
    ports:
      - "8080:8080"
    command: python main.py --url "${ISSUE_URL:-https://github.com/fastapi/fastapi/issues/1234}"

  # ── Evaluation runner ──────────────────────────────────────────
  eval:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      CACHE_DIR: /data/cache
    volumes:
      - triage_cache:/data/cache
      - ./trajectories:/app/trajectories
    command: python main.py --eval --no-hil --output /app/trajectories
    profiles: ["eval"]   # запускати лише при: docker compose --profile eval up

volumes:
  triage_cache:
